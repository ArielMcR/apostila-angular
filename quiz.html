<!DOCTYPE html>
<html lang="pt-br" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz · Minicurso de Angular</title>
<style>
:root {
  --red: #dd0031;
  --red-dark: #b80029;
  --green: #16a34a;
  --green-bg: #eafaf0;
  --red-bg: #fdeef1;
  --blue: #2563eb;

  --bg: #eef1f5;
  --paper: #ffffff;
  --ink: #1a2230;
  --muted: #667085;
  --line: #e4e7ec;
  --soft: #f6f7f9;
  --shadow: 0 12px 44px rgba(20,30,50,.10);
}
html[data-theme="dark"] {
  --bg: #0b0e14;
  --paper: #151a22;
  --ink: #e6ebf2;
  --muted: #98a2b3;
  --line: #262d38;
  --soft: #1b212b;
  --green-bg: #12261a;
  --red-bg: #2a1418;
  --shadow: 0 12px 44px rgba(0,0,0,.45);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: "Inter", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 28px 16px 60px;
}

.topbar {
  width: 100%; max-width: 720px;
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 18px;
}
.logo {
  width: 40px; height: 40px; border-radius: 10px;
  background: var(--red); color: #fff;
  display: grid; place-items: center; font-weight: 900; font-size: 20px;
  flex-shrink: 0;
}
.title-wrap .t1 { font-weight: 800; font-size: 17px; line-height: 1.1; }
.title-wrap .t2 { font-size: 12px; color: var(--muted); }
.theme-btn {
  margin-left: auto;
  background: var(--paper); border: 1px solid var(--line); color: var(--ink);
  border-radius: 9px; padding: 8px 12px; cursor: pointer; font-size: 14px; font-weight: 600;
}

.card {
  width: 100%; max-width: 720px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-top: 6px solid var(--red);
  border-radius: 16px;
  box-shadow: var(--shadow);
  padding: 30px 34px 34px;
}

/* barra de progresso */
.progress-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 22px; }
.bar > span { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--red), var(--red-dark)); border-radius: 99px; transition: width .3s ease; }

.cat-tag {
  display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;
  color: var(--red); background: var(--red-bg); padding: 4px 11px; border-radius: 999px; margin-bottom: 12px;
}
.question { font-size: 19px; font-weight: 700; margin: 4px 0 20px; line-height: 1.4; }
.question code, .exp code, .opt code {
  font-family: "JetBrains Mono","Consolas",monospace; font-size: .9em;
  background: var(--soft); border: 1px solid var(--line); color: var(--red-dark);
  padding: 1px 5px; border-radius: 5px;
}
html[data-theme="dark"] .question code, html[data-theme="dark"] .exp code, html[data-theme="dark"] .opt code { color: #ff8ba0; }

.options { display: flex; flex-direction: column; gap: 11px; }
.opt {
  text-align: left;
  border: 2px solid var(--line);
  background: var(--paper);
  color: var(--ink);
  border-radius: 12px;
  padding: 14px 16px;
  font-size: 15.5px;
  font-family: inherit;
  cursor: pointer;
  display: flex; align-items: center; gap: 12px;
  transition: border-color .15s, background .15s, transform .05s;
}
.opt:hover:not(:disabled) { border-color: var(--red); transform: translateX(3px); }
.opt:disabled { cursor: default; }
.opt .letter {
  flex-shrink: 0;
  width: 28px; height: 28px; border-radius: 8px;
  background: var(--soft); border: 1px solid var(--line);
  display: grid; place-items: center; font-weight: 800; font-size: 14px;
}
.opt.correct { border-color: var(--green); background: var(--green-bg); }
.opt.correct .letter { background: var(--green); color: #fff; border-color: var(--green); }
.opt.wrong { border-color: var(--red); background: var(--red-bg); }
.opt.wrong .letter { background: var(--red); color: #fff; border-color: var(--red); }
.opt .mark { margin-left: auto; font-weight: 900; font-size: 18px; }

.exp {
  margin-top: 18px;
  padding: 14px 16px;
  border-radius: 12px;
  background: var(--soft);
  border: 1px solid var(--line);
  border-left: 5px solid var(--blue);
  font-size: 14.5px;
  display: none;
}
.exp.show { display: block; }
.exp .exp-title { font-weight: 800; margin-bottom: 4px; }
.exp.ok { border-left-color: var(--green); }
.exp.ok .exp-title { color: var(--green); }
.exp.no { border-left-color: var(--red); }
.exp.no .exp-title { color: var(--red); }

.actions { margin-top: 22px; display: flex; justify-content: flex-end; gap: 10px; }
.btn {
  border: none; border-radius: 10px; padding: 12px 22px;
  font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit;
}
.btn-primary { background: var(--red); color: #fff; }
.btn-primary:hover { background: var(--red-dark); }
.btn-primary:disabled { opacity: .4; cursor: not-allowed; }
.btn-ghost { background: var(--soft); color: var(--ink); border: 1px solid var(--line); }

/* tela inicial e final */
.center { text-align: center; }
.hero-title { font-size: 27px; font-weight: 900; margin: 6px 0 10px; }
.hero-sub { color: var(--muted); font-size: 16px; margin-bottom: 22px; }
.meta-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 20px 0 26px; }
.meta-chip { background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; font-size: 14px; }
.meta-chip b { display: block; font-size: 20px; color: var(--red); }

.score-ring {
  width: 150px; height: 150px; border-radius: 50%;
  margin: 10px auto 6px;
  display: grid; place-items: center;
  background: conic-gradient(var(--red) var(--deg,0deg), var(--line) 0deg);
}
.score-ring .inner {
  width: 118px; height: 118px; border-radius: 50%;
  background: var(--paper);
  display: grid; place-items: center;
}
.score-ring .pct { font-size: 34px; font-weight: 900; }
.score-msg { font-size: 18px; font-weight: 700; margin: 8px 0 4px; }
.score-detail { color: var(--muted); margin-bottom: 16px; }

/* medalha de conceito (A/B/C/D) */
.conceito-medal {
  width: 92px; height: 92px; margin: 4px auto 2px;
  border-radius: 22px;
  display: grid; place-items: center;
  font-size: 50px; font-weight: 900; color: #fff;
  background: var(--cc, var(--red));
  box-shadow: 0 10px 26px color-mix(in srgb, var(--cc, var(--red)) 45%, transparent);
}
.conceito-label {
  font-size: 12px; font-weight: 800; letter-spacing: 2px;
  text-transform: uppercase; color: var(--muted);
}

/* faixa de referência dos conceitos */
.conceito-tabela {
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
  margin: 4px 0 22px;
}
.conceito-tabela span {
  font-size: 13px; font-weight: 700;
  padding: 6px 12px; border-radius: 999px;
  background: var(--soft); color: var(--muted);
  border: 1px solid var(--line);
}
.conceito-tabela span.on {
  background: var(--ink); color: var(--paper);
  border-color: var(--ink);
}

.review { text-align: left; margin-top: 10px; }
.review h3 { font-size: 16px; margin: 22px 0 10px; }
.rev-item { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 9px 0; font-size: 14px; }
.rev-item .rq { font-weight: 700; margin-bottom: 5px; }
.rev-item .ra { color: var(--muted); }
.rev-item.hit { border-left: 4px solid var(--green); }
.rev-item.miss { border-left: 4px solid var(--red); }
.rev-item .tag { font-weight: 800; font-size: 12px; }
.rev-item.hit .tag { color: var(--green); }
.rev-item.miss .tag { color: var(--red); }

.footer-note { max-width: 720px; text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 20px; }

@media (max-width: 560px) {
  .card { padding: 22px 18px 26px; }
  .question { font-size: 17px; }
  .opt { font-size: 14.5px; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">A</div>
  <div class="title-wrap">
    <div class="t1">Quiz de Angular</div>
    <div class="t2">Avaliação do minicurso · CRUD, componentes e signals</div>
  </div>
  <button class="theme-btn" id="theme-btn">🌙</button>
</div>

<div class="card" id="card"><!-- conteúdo dinâmico --></div>

<div class="footer-note">
  Avaliação formativa · corrige automaticamente e explica cada resposta.
</div>

<!-- ===== BANCO DE QUESTÕES (embutido) ===== -->
<script>
const BANCO = [{"cat": "Ambiente", "q": "As máquinas do laboratório têm Node.js 18. Qual versão do Angular usamos no curso por ser compatível com esse Node?", "options": ["Angular 22", "Angular 20", "Angular 17", "Angular 15"], "correct": 2, "exp": "O Angular 17 exige no mínimo Node 18.13, então roda com o Node 18 do laboratório. As versões 20/21/22 exigem Node 20 ou superior."}, {"cat": "Componentes", "q": "No decorador @Component, o que o 'selector' define?", "options": ["O arquivo de estilo do componente", "A tag HTML que representa o componente", "A rota que exibe o componente", "O nome da classe TypeScript"], "correct": 1, "exp": "O selector é a 'tag' usada para inserir o componente em outro template, por exemplo `<app-contatos></app-contatos>`."}, {"cat": "Data binding", "q": "Qual sintaxe é usada para reagir a um evento, como um clique de botão?", "options": ["{{ }} (chaves duplas)", "[ ] (colchetes)", "( ) (parênteses)", "[( )] (colchetes com parênteses)"], "correct": 2, "exp": "Parênteses `( )` fazem o event binding, por exemplo `(click)=\"salvar()\"`. Colchetes são property binding e chaves duplas são interpolação."}, {"cat": "Signals", "q": "Como se LÊ o valor de um signal chamado 'contador' dentro do template?", "options": ["{{ contador }}", "{{ contador() }}", "{{ contador.value }}", "{{ get(contador) }}"], "correct": 1, "exp": "Signal é lido chamando como função, com parênteses: `contador()`. Esquecer o () é um dos erros mais comuns de iniciantes."}, {"cat": "Control flow", "q": "Qual é a forma moderna (control flow embutido) de repetir uma lista no template?", "options": ["*ngFor", "@for", "v-for", "{{ for }}"], "correct": 1, "exp": "O novo control flow usa `@for (item of lista; track item.id) { ... }`. O `*ngFor` é a forma antiga."}, {"cat": "Service e DI", "q": "Qual é a principal responsabilidade de um service?", "options": ["Definir o visual (HTML e CSS) da tela", "Concentrar a lógica de dados e regras de negócio", "Configurar as rotas da aplicação", "Estilizar os componentes"], "correct": 1, "exp": "O service concentra dados e regras de negócio (como o CRUD), deixando os componentes focados na tela."}, {"cat": "Service e DI", "q": "Qual é a forma moderna de injetar um service dentro de um componente?", "options": ["const s = new ContatoService()", "const s = inject(ContatoService)", "import ContatoService as s", "provide(ContatoService)"], "correct": 1, "exp": "A função `inject(ContatoService)` entrega a instância pronta. Não se cria service com `new`; a injeção de dependência cuida disso."}, {"cat": "CRUD", "q": "No CRUD, a sigla corresponde a quais operações?", "options": ["Copy, Read, Undo, Delete", "Create, Read, Update, Delete", "Connect, Run, Update, Deploy", "Create, Reload, Undo, Deploy"], "correct": 1, "exp": "CRUD = Create (criar), Read (ler/listar), Update (atualizar) e Delete (excluir) — as quatro operações básicas com dados."}, {"cat": "Roteamento", "q": "No template, qual atributo usamos para navegar entre rotas sem recarregar a página?", "options": ["href", "routerLink", "src", "ngRoute"], "correct": 1, "exp": "`routerLink` navega sem recarregar. Usar `href` recarregaria a página inteira, perdendo a vantagem da SPA."}, {"cat": "API REST", "q": "Qual verbo HTTP normalmente usamos para CRIAR um novo registro numa API REST?", "options": ["GET", "POST", "PUT", "DELETE"], "correct": 1, "exp": "POST cria. GET lê, PUT atualiza e DELETE remove."}];
</script>

<!-- ===== LÓGICA DO QUIZ ===== -->
<script>
/* ----- tema ----- */
const htmlEl = document.documentElement;
function setTheme(t){
  htmlEl.setAttribute('data-theme', t);
  try { localStorage.setItem('quiz-tema', t); } catch(e){}
  document.getElementById('theme-btn').textContent = t === 'dark' ? '☀️' : '🌙';
}
(function(){ let s='light'; try{ s=localStorage.getItem('quiz-tema')||'light'; }catch(e){} setTheme(s); })();
document.getElementById('theme-btn').addEventListener('click',
  () => setTheme(htmlEl.getAttribute('data-theme')==='dark'?'light':'dark'));

/* ----- utilidades ----- */
const LETRAS = ['A','B','C','D','E'];
function embaralhar(arr){
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* ----- estado ----- */
let questoes = [];      // questões desta rodada (embaralhadas, com opções embaralhadas)
let atual = 0;
let respostas = [];     // { escolhaIdx, correta:bool }
let respondidaAgora = false;

const card = document.getElementById('card');

/* ----- preparar rodada ----- */
function prepararRodada(){
  // embaralha a ordem das questões e, dentro de cada uma, a ordem das opções
  questoes = embaralhar(BANCO).map(q => {
    const idxs = embaralhar(q.options.map((_,i)=>i));
    const novasOpts = idxs.map(i => q.options[i]);
    const novoCorrect = idxs.indexOf(q.correct);
    return { cat:q.cat, q:q.q, exp:q.exp, options:novasOpts, correct:novoCorrect };
  });
  atual = 0;
  respostas = [];
}

/* ----- telas ----- */
function telaInicio(){
  card.innerHTML = `
    <div class="center">
      <div class="cat-tag">Avaliação</div>
      <h1 class="hero-title">Teste o que você aprendeu</h1>
      <p class="hero-sub">Um quiz rápido sobre os principais conceitos do minicurso de Angular:
      ambiente, componentes, data binding, signals, control flow, service, CRUD, roteamento e HTTP.</p>
      <div class="meta-row">
        <div class="meta-chip"><b>${BANCO.length}</b>questões</div>
        <div class="meta-chip"><b>1</b>por vez</div>
        <div class="meta-chip"><b>✓</b>com explicação</div>
      </div>
      <button class="btn btn-primary" id="btn-start">Começar quiz →</button>
    </div>`;
  document.getElementById('btn-start').addEventListener('click', () => {
    prepararRodada();
    renderQuestao();
    window.scrollTo({top:0, behavior:'smooth'});
  });
}

function renderQuestao(){
  respondidaAgora = false;
  const q = questoes[atual];
  const total = questoes.length;
  const pct = Math.round((atual)/total*100);

  const opts = q.options.map((txt,i)=>`
    <button class="opt" data-i="${i}">
      <span class="letter">${LETRAS[i]}</span>
      <span class="otext">${txt}</span>
    </button>`).join('');

  card.innerHTML = `
    <div class="progress-head">
      <span>Questão ${atual+1} de ${total}</span>
      <span>${q.cat}</span>
    </div>
    <div class="bar"><span style="width:${pct}%"></span></div>

    <div class="cat-tag">${q.cat}</div>
    <div class="question">${q.q}</div>
    <div class="options" id="options">${opts}</div>

    <div class="exp" id="exp"></div>

    <div class="actions">
      <button class="btn btn-primary" id="btn-next" disabled>
        ${atual+1===total ? 'Ver resultado' : 'Próxima →'}
      </button>
    </div>`;

  card.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => escolher(parseInt(btn.dataset.i,10)));
  });
  document.getElementById('btn-next').addEventListener('click', proxima);
}

function escolher(i){
  if (respondidaAgora) return;
  respondidaAgora = true;
  const q = questoes[atual];
  const acertou = (i === q.correct);
  respostas.push({ escolhaIdx:i, correta:acertou });

  const botoes = card.querySelectorAll('.opt');
  botoes.forEach((b,idx)=>{
    b.disabled = true;
    if (idx === q.correct){ b.classList.add('correct'); b.insertAdjacentHTML('beforeend','<span class="mark">✓</span>'); }
    if (idx === i && !acertou){ b.classList.add('wrong'); b.insertAdjacentHTML('beforeend','<span class="mark">✗</span>'); }
  });

  const exp = document.getElementById('exp');
  exp.className = 'exp show ' + (acertou ? 'ok' : 'no');
  exp.innerHTML = `<div class="exp-title">${acertou ? '✓ Correto!' : '✗ Não foi dessa vez'}</div>${q.exp}`;

  document.getElementById('btn-next').disabled = false;
  // atualiza a barra para incluir a questão respondida
  card.querySelector('.bar > span').style.width = Math.round((atual+1)/questoes.length*100)+'%';
}

function proxima(){
  atual++;
  if (atual < questoes.length){ renderQuestao(); window.scrollTo({top:0, behavior:'smooth'}); }
  else { telaResultado(); window.scrollTo({top:0, behavior:'smooth'}); }
}

function telaResultado(){
  const acertos = respostas.filter(r=>r.correta).length;
  const total = questoes.length;
  const pct = Math.round(acertos/total*100);

  // Nota numa escala de 0 a 10 (independente do total de questões)
  const nota = acertos / total * 10;

  // Conceito conforme a nota:  9-10 = A | 7-8 = B | 5-6 = C | abaixo = D
  let conceito, msg;
  if (nota >= 9)      { conceito = 'A'; msg = 'Excelente! Você dominou o conteúdo. 🎉'; }
  else if (nota >= 7) { conceito = 'B'; msg = 'Muito bom! Base sólida, revise os poucos pontos que faltaram.'; }
  else if (nota >= 5) { conceito = 'C'; msg = 'No caminho certo. Vale revisar alguns conceitos.'; }
  else                { conceito = 'D'; msg = 'Sem problemas — revise o guia e tente de novo. Faz parte! 💪'; }

  const conceitoCor = { A:'var(--green)', B:'var(--blue)', C:'#f59e0b', D:'var(--red)' }[conceito];

  const revItems = questoes.map((q,idx)=>{
    const r = respostas[idx];
    const acertou = r.correta;
    return `
      <div class="rev-item ${acertou?'hit':'miss'}">
        <div class="tag">${acertou?'✓ Acertou':'✗ Errou'} · ${q.cat}</div>
        <div class="rq">${idx+1}. ${q.q}</div>
        <div class="ra">Resposta correta: <b>${LETRAS[q.correct]}) ${q.options[q.correct]}</b></div>
        ${acertou ? '' : `<div class="ra" style="margin-top:4px;">${q.exp}</div>`}
      </div>`;
  }).join('');

  card.innerHTML = `
    <div class="center">
      <div class="cat-tag">Resultado</div>
      <div class="conceito-medal" style="--cc:${conceitoCor}">${conceito}</div>
      <div class="conceito-label">Conceito</div>
      <div class="score-ring" style="--deg:${pct*3.6}deg; margin-top:14px;">
        <div class="inner"><span class="pct">${pct}%</span></div>
      </div>
      <div class="score-msg">${msg}</div>
      <div class="score-detail">
        Nota <b>${nota.toLocaleString('pt-BR',{maximumFractionDigits:1})}</b> ·
        você acertou <b>${acertos}</b> de <b>${total}</b> questões.
      </div>
      <div class="conceito-tabela">
        <span class="${conceito==='A'?'on':''}">A · 9–10</span>
        <span class="${conceito==='B'?'on':''}">B · 7–8</span>
        <span class="${conceito==='C'?'on':''}">C · 5–6</span>
        <span class="${conceito==='D'?'on':''}">D · abaixo</span>
      </div>
      <div class="actions" style="justify-content:center;">
        <button class="btn btn-ghost" id="btn-review">Revisar respostas</button>
        <button class="btn btn-primary" id="btn-retry">Refazer quiz</button>
      </div>
    </div>
    <div class="review" id="review" style="display:none;">
      <h3>Revisão detalhada</h3>
      ${revItems}
      <div class="actions" style="justify-content:center; margin-top:24px;">
        <button class="btn btn-primary" id="btn-retry2">Refazer quiz</button>
      </div>
    </div>`;

  document.getElementById('btn-retry').addEventListener('click', reiniciar);
  document.getElementById('btn-retry2').addEventListener('click', reiniciar);
  document.getElementById('btn-review').addEventListener('click', ()=>{
    const rev = document.getElementById('review');
    const vis = rev.style.display !== 'none';
    rev.style.display = vis ? 'none' : 'block';
    document.getElementById('btn-review').textContent = vis ? 'Revisar respostas' : 'Ocultar revisão';
    if (!vis) rev.scrollIntoView({behavior:'smooth'});
  });
}

function reiniciar(){ prepararRodada(); renderQuestao(); window.scrollTo({top:0, behavior:'smooth'}); }

/* ----- start ----- */
telaInicio();
</script>

</body>
</html>
